<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Zona Cliente{% endblock %}</title>
    <!-- Bootstrap CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Logo -->
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" width="40" height="40" class="d-inline-block align-text-top">
                Comersa
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <!-- Menú Clientes -->  
                   <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarCliente" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Clientes
                        </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarCliente">
                         <li><a class="dropdown-item" href="/clientes">Edita Clientes</a></li>
                    </ul>
                   </li>

                    
                   
                    <!-- Menú Zonas -->  
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarZona" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Zonas
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarZonas">
                            <li class="dropdown-item" href="/">Agregar Zona</a></li>
                            <li><a class="dropdown-item" href="/zonas">Listar Zonas</a></li>
                        </ul>
                    </li>

                    
                    <!-- Menú desplegable de Reportes -->
                    <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarReporte" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Reportes
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarReporte">
                        <li><a class="dropdown-item" href="/reporte">Ventas por zona</a></li>
                         
                        <!-- Aquí puedes agregar más reportes -->
                    </ul>
                </li>

                    <li class="nav-item"><a class="nav-link" href="/ventas_perdidas">Ventas perdidas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
