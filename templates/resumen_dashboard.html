{% extends "layout.html" %}
{% block title %}Resumen General{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='reportes.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='resumen_tablero.css') }}">
<style>
  /* Pantalla completa: sin el ancho fijo del layout y sin desplazamiento en computadora */
  .principal > .contenido { max-width: none; margin-top: .4rem !important; padding: 0 .5rem; }
  @media (min-width: 992px) {
    .principal { height: 100vh; overflow: hidden; }
    .principal > .contenido { flex: 1; min-height: 0; padding-bottom: .4rem; }
    .resumen { height: 100%; grid-template-rows: auto auto minmax(0, 1fr) auto; }
    .resumen .grafico { height: 100%; }
  }
</style>
{% include "_resumen_tablero.html" %}
{% endblock %}

{% block scripts %}
{% include "_resumen_tablero_js.html" %}
{% endblock %}
