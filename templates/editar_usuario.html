<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h3 class="mb-4">Editar Usuario</h3>

    <form method="POST">
        <!-- Campo Usuario -->
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" name="usuario" id="usuario" class="form-control" 
                   value="{{ user.usuario }}" required>
        </div>

        <!-- Campo Rol -->
        <div class="mb-3">
            <label for="rol" class="form-label">Rol</label>
            <select name="rol" id="rol" class="form-select">
                <option value="usuario" {% if user.rol == 'usuario' %}selected{% endif %}>Usuario</option>
                <option value="admin" {% if user.rol == 'admin' %}selected{% endif %}>Administrador</option>
            </select>
        </div>

        <!-- Campo Contraseña -->
        <div class="mb-3">
            <label for="password" class="form-label">Nueva Contraseña</label>
            <input type="password" name="password" id="password" class="form-control">
            <small class="text-muted">Deja vacío si no deseas cambiar la contraseña.</small>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control">
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary">💾 Guardar cambios</button>
            <a href="{{ url_for('usuarios.listar_usuarios') }}" class="btn btn-secondary">↩️ Volver</a>
        </div>
    </form>
</div>

<script>
    // Validación simple en cliente
    document.querySelector("form").addEventListener("submit", function(e) {
        const pass = document.getElementById("password").value;
        const confirm = document.getElementById("confirm_password").value;
        if (pass && pass !== confirm) {
            e.preventDefault();
            alert("❌ Las contraseñas no coinciden");
        }
    });
</script>
</body>
</html>
