{% extends "layout.html" %}
{% block title %}Iniciar Sesión - Grupo Comersa{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <!-- Ajuste responsive: ocupa todo en móvil, menos en pantallas grandes -->
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-primary text-white text-center">
        <h4><i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión</h4>
      </div>
      <div class="card-body">
        {% if error %}
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endif %}
        <form method="POST">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" name="usuario" id="usuario" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-door-open me-2"></i> Entrar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
