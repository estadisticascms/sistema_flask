<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h3 class="mb-4">🔑 Cambiar Contraseña</h3>

    <form method="POST" class="bg-light p-3 rounded shadow-sm">
        <!-- Usuario -->
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" class="form-control" value="{{ user.usuario }}" disabled>
        </div>

        <!-- Nueva contraseña -->
        <div class="mb-3">
            <label for="password" class="form-label">Nueva Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>

        <!-- Confirmar contraseña -->
        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success">💾 Guardar</button>
            <a href="{{ url_for('usuarios.listar_usuarios') }}" class="btn btn-secondary">↩️ Volver</a>
        </div>
    </form>
</div>

<script>
    // Validación en cliente: confirmar que ambas contraseñas coinciden
    document.querySelector("form").addEventListener("submit", function(e) {
        const pass = document.getElementById("password").value;
        const confirm = document.getElementById("confirm_password").value;
        if (pass !== confirm) {
            e.preventDefault();
            alert("❌ Las contraseñas no coinciden");
        }
    });
</script>
</body>
</html>
