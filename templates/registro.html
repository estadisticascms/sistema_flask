<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h3 class="mb-4">Registrar Nuevo Usuario</h3>

    <form method="POST">
        <!-- Campo Usuario -->
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" name="usuario" id="usuario" class="form-control" placeholder="Nombre de usuario" required>
        </div>

        <!-- Campo Contraseña -->
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña segura" required>
        </div>

        <!-- Campo Rol -->
        <div class="mb-3">
            <label for="rol" class="form-label">Rol</label>
            <select name="rol" id="rol" class="form-select">
                <option value="usuario" selected>Usuario</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success">➕ Registrar</button>
            <a href="{{ url_for('usuarios.listar_usuarios') }}" class="btn btn-secondary">↩️ Volver</a>
        </div>
    </form>
</div>
</body>
</html>
