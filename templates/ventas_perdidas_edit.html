{% extends "layout.html" %}
{% block title %}Editar Venta Perdida{% endblock %}

{% block content %}
<div class="container mt-3 mb-4" style="max-width: 760px">
  <h5><i class="bi bi-pencil" aria-hidden="true"></i> Editar venta perdida</h5>
  <form method="post" class="card card-body shadow-sm">
    <input type="hidden" name="volver" value="{{ volver }}">
    <div class="row g-2">
      <div class="col-6 col-md-4"><label class="form-label small" for="fecha">Fecha</label>
        <input type="date" id="fecha" class="form-control" name="fecha" value="{{ registro.fecha }}" required></div>
      <div class="col-6 col-md-8"><label class="form-label small" for="nomb_vendedor">Vendedor</label>
        <input type="text" id="nomb_vendedor" class="form-control" name="nomb_vendedor" maxlength="50" value="{{ registro.nomb_vendedor or '' }}" required></div>
      <div class="col-12"><label class="form-label small" for="nomb_cliente">Cliente</label>
        <input type="text" id="nomb_cliente" class="form-control" name="nomb_cliente" maxlength="100" value="{{ registro.nomb_cliente or '' }}" required></div>
      <div class="col-12 col-md-4"><label class="form-label small" for="codigo_producto">Código del catálogo</label>
        <input type="text" id="codigo_producto" class="form-control" name="codigo_producto" maxlength="30" value="{{ registro.codigo_producto or '' }}" placeholder="COM…">
        <div class="form-text">Si lo indica, parte, descripción y marca se toman del catálogo.</div></div>
      <div class="col-12 col-md-4"><label class="form-label small" for="numero_parte">N° parte</label>
        <input type="text" id="numero_parte" class="form-control" name="numero_parte" maxlength="100" value="{{ registro.numero_parte or '' }}"></div>
      <div class="col-12 col-md-4"><label class="form-label small" for="marca">Marca</label>
        <input type="text" id="marca" class="form-control" name="marca" maxlength="100" value="{{ registro.marca or '' }}"></div>
      <div class="col-12"><label class="form-label small" for="descripcion">Descripción</label>
        <input type="text" id="descripcion" class="form-control" name="descripcion" maxlength="100" value="{{ registro.descripcion or '' }}"></div>
      <div class="col-6 col-md-3"><label class="form-label small" for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" class="form-control text-end" name="cantidad" min="0.01" step="any" value="{{ registro.cantidad }}" required></div>
      <div class="col-6 col-md-4"><label class="form-label small" for="motivo">Motivo</label>
        <select id="motivo" name="motivo" class="form-select"><option value="">—</option>
          {% for m in motivos %}<option {% if m == registro.motivo %}selected{% endif %}>{{ m }}</option>{% endfor %}</select></div>
      <div class="col-12"><label class="form-label small" for="nota">Nota</label>
        <textarea id="nota" class="form-control" name="nota" rows="2" maxlength="255">{{ registro.nota or '' }}</textarea></div>
      <div class="col-12 d-flex gap-2 mt-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check2" aria-hidden="true"></i> Guardar</button>
        <a href="{{ volver }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
