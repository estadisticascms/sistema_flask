<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Grupo Comersa{% endblock %}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Estilos exclusivos para login -->
    <style>
        :root {
            --color-principal: #FE6412;   /* Naranja */
            --color-secundario: #027266;  /* Verde azulado */
            --color-neutro: #666666;      /* Gris */
            --color-fondo: #f9f9f9;       /* Fondo claro */
        }

        body {
            background: var(--color-fondo);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 600px;   /* más ancho en móvil */
            border-radius: 10px;
            margin: 0 15px;
        }

        .logo {
            max-width: 120px;
        }

        .card-header {
            background-color: var(--color-secundario);
        }

        .card-header h4 {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .card-body {
            padding: 1.5rem;
        }

        .form-control {
            font-size: 1rem;
            padding: 0.8rem;
        }

        .btn-login {
            background-color: var(--color-principal);
            border: none;
            font-size: 1.1rem;
            padding: 0.8rem;
        }

        .btn-login:hover {
            background-color: #e4570f;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .login-card {
                max-width: 95%;
            }
            .form-control, .btn-login {
                font-size: 1.2rem;
                padding: 1rem;
            }
            .card-header h4 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
