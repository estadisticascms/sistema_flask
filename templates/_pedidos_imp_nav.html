{# Pestañas comunes del módulo de pedidos de importación. Variable: activo #}
<style>
  .imp-nav .nav-link { color: #027266; }
  .imp-nav .nav-link.active { background: #027266; color: #fff; }

  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .vacio { color: #b5b3ad; }
</style>
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">

  <ul class="nav nav-pills imp-nav small gap-1">
