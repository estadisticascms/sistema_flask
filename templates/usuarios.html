<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h3 class="mb-4">Usuarios Registrados</h3>

    <!-- Botón para crear nuevo usuario -->
    <a href="{{ url_for('usuarios.registro') }}" class="btn btn-success mb-3">➕ Nuevo Usuario</a>

    <!-- Tabla de usuarios -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Fecha de creación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.usuario }}</td>
                <td>
                    {% if u.rol == 'admin' %}
                        <span class="badge bg-danger">Administrador</span>
                    {% else %}
                        <span class="badge bg-secondary">Usuario</span>
                    {% endif %}
                </td>
                <td>{{ u.creado }}</td>
                <td>
                    <a href="{{ url_for('usuarios.editar_usuario', id=u.id) }}" class="btn btn-sm btn-warning">✏️ Editar</a>
                    <a href="{{ url_for('usuarios.eliminar_usuario', id=u.id) }}" class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">🗑️ Eliminar</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" class="text-center">No hay usuarios registrados</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
